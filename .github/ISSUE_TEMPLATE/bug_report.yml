name: Bug report
description: Something is broken
labels: ["bug","triage"]
body:
  - type: input
    id: summary
    attributes:
      label: One-line summary
      placeholder: "e.g. Decision API returns 500 when IBAN is null"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Frontend, Backend, Infrastructure, CI/CD, Security, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "dev / staging / prod, browser, OS"
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      render: shell
