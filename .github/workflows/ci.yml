name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"
  PNPM_VERSION: "9"

jobs:

  # ── Detect what changed ────────────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.f.outputs.web }}
      api: ${{ steps.f.outputs.api }}
      infra: ${{ steps.f.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
            api:
              - 'apps/api/**'
            infra:
              - 'infrastructure/**'

  # ── Frontend: lint → typecheck → test → build ─────────────────────────────
  web:
    name: "FE — lint / test / build"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (Dependency vulnerabilities)
        run: pnpm audit --prod --audit-level high || true # Set to true temporarily until we fix all vulnerabilities

      - name: Typecheck
        run: pnpm turbo run typecheck --filter=@sme-lending-platform/web

      - name: Lint
        run: pnpm turbo run lint --filter=@sme-lending-platform/web || true

      - name: Unit tests + coverage
        run: pnpm turbo run test --filter=@sme-lending-platform/web
        env:
          CI: true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: apps/web/coverage/lcov.info
          flags: web

      - name: Build
        run: pnpm turbo run build --filter=@sme-lending-platform/web

      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  # ── Backend: lint → typecheck → security → test ───────────────────────────
  api:
    name: "BE — lint / test / security"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: creditcore_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          cd apps/api
          pip install -e ".[dev]"

      - name: Ruff lint
        run: cd apps/api && ruff check .

      - name: Ruff format check
        run: cd apps/api && ruff format --check .

      - name: Mypy
        run: cd apps/api && mypy app/ || true # Non-blocking until type coverage is complete

      - name: Bandit (security static analysis)
        run: cd apps/api && bandit -r app/ -ll || true # Non-blocking; findings triaged in ruff S-rules

      - name: pip-audit (dependency CVEs)
        run: cd apps/api && pip-audit || true # Non-blocking; advisory only

      - name: Unit tests
        run: cd apps/api && pytest tests/unit -v
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/creditcore_test
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key
          JWT_SECRET_KEY: test-jwt-key

      - name: Integration tests
        run: cd apps/api && pytest tests/integration -v
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/creditcore_test
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key
          JWT_SECRET_KEY: test-jwt-key

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: apps/api/coverage.xml
          flags: api

  # ── Secret scanning (runs on every push) ──────────────────────────────────
  secrets-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── DAST: Dynamic Application Security Testing (OWASP ZAP) ────────────────
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [web, api]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # In a real scenario, we would spin up the frontend and backend in docker here.
      # For now, we simulate DAST running against a placeholder or staging URL.
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'https://finpals-prototype.vercel.app' # Replace with actual staging URL or local docker instance
          fail_action: false # Set to false initially to review reports without blocking CI
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

  # ── Terraform validate (infra changes only) ────────────────────────────────
  infra-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"
      - name: fmt check
        run: terraform fmt -check -recursive infrastructure/
      - name: validate dev
        run: |
          cd infrastructure/terraform/environments/dev
          terraform init -backend=false
          terraform validate

  # ── All-green gate (required status check in GitHub) ──────────────────────
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [web, api, secrets-scan, dast]
    if: always()
    steps:
      - name: Check results
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          if echo "$results" | grep -q '"result": "failure"'; then
            echo "One or more jobs failed"; exit 1
          fi
          echo "All checks passed"
