[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "finpal-api"
version = "0.1.0"
description = "FinPal — AI-driven SME Lending Platform API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "boto3>=1.34",
  "structlog>=24.1",
  "python-dotenv>=1.0",
  "aiofiles>=23.0",
  # AI credit-decisioning engine (Engine 2)
  "scikit-learn>=1.5",
  "lightgbm>=4.0",
  "shap>=0.45",
  "joblib>=1.3",
  "pandas>=2.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.4",
  "mypy>=1.10",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[tool.ruff]
target-version = "py312"
line-length = 88
select = ["E","F","W","I","N","UP","S","B","A","C4","PT","RUF"]
ignore = ["S101","S105","S106"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=xml --cov-report=term-missing"

[tool.coverage.run]
omit = ["tests/*", "*/migrations/*"]
