[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finpal-api"
version = "0.1.0"
description = "FinPal — AI-driven SME Lending Platform API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "boto3>=1.34",
  "structlog>=24.1",
  "python-dotenv>=1.0",
  "aiofiles>=23.0",
  # AI credit-decisioning engine (Engine 2)
  "scikit-learn>=1.5",
  "lightgbm>=4.0",
  "shap>=0.45",
  "joblib>=1.3",
  "pandas>=2.0",
  "numpy>=1.26",
  # IDP field extractor (Engine 1)
  "sklearn-crfsuite>=0.5",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.4",
  "mypy>=1.10",
  "bandit>=1.7",
  "pip-audit>=2.7",
]
ocr = [
  # pretrained OCR for image/scanned uploads (ONNX, no GPU). Production may use AWS Textract.
  "rapidocr-onnxruntime>=1.3",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E","F","W","I","N","UP","S","B","A","C4","PT","RUF"]
# UP042: the codebase uses the (str, Enum) idiom throughout (ApplicationStatus, UserRole, ...)
# S311: random only used for demo reference numbers, never crypto
# S603/S608/S108: Lambda cold-start bootstrap (subprocess pip install, /tmp paths,
#                 parameterised dynamic SQL) — required by the AWS Lambda runtime
# B904: explicit `raise ... from` not needed for these user-facing HTTP errors
# E402: lambda_handler must install packages before importing app modules
# N803: form-field args mirror the frontend's camelCase multipart keys
# E501: wide ORM column definitions and descriptive f-strings exceed 88 cols
ignore = [
  "S101", "S105", "S106", "UP042",
  "S311", "S603", "S608", "S108",
  "B904", "E402", "N803", "E501",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection callables are safe in argument defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path",
  "fastapi.Body", "fastapi.Header", "fastapi.Form", "fastapi.File",
  "app.core.security.require_roles", "app.core.security.get_current_user"]

[tool.ruff.lint.per-file-ignores]
# __init__.py files intentionally re-export the package's public API
"**/__init__.py" = ["F401"]
# ML modules: long descriptive comments + intentional best-effort doc parsing
"app/services/ai/**" = ["E501", "S110"]
"app/services/queue.py" = ["E501", "S110"]
# dev/demo scripts are not shipped library code
"scripts/**" = ["E501", "S110", "N806", "C408"]
# tests intentionally assert broad exceptions for validation failures
"tests/**" = ["E501", "PT018", "B017", "PT011"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
# the app is a PEP 420 namespace package (no __init__.py) — needed for `mypy app/` to resolve
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
# ML/AI code relies on untyped libs (scikit-learn, pandas, sklearn-crfsuite) — relax strict here
module = ["app.services.ai.*", "app.services.queue"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false
check_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=xml --cov-report=term-missing"

[tool.coverage.run]
omit = ["tests/*", "*/migrations/*"]
